<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>생명나무 열매 맺기</title>
  <!-- 텔레그램 웹앱 SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase 실시간 DB SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1>생명나무 열매 맺기</h1>
      <span class="info-badge">화면의 나무를 터치하면 열매가 열립니다 🍎</span>
    </div>
    <!-- 11개 구역 선택 바 -->
    <nav class="zone-bar" id="zoneBar"></nav>
  </header>

  <!-- 메인 인터랙티브 나무 영역 -->
  <main class="tree-container" id="treeContainer">
    <!-- 내장형 황금빛 생명나무 SVG (직선 광선 제거 및 은은한 후광 적용) -->
    <div class="tree-svg-wrap">
      <svg class="life-tree-svg" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 하늘 그라데이션 -->
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a75d3" />
            <stop offset="35%" stop-color="#64b5f6" />
            <stop offset="65%" stop-color="#fff9d6" />
            <stop offset="100%" stop-color="#ffecb3" />
          </linearGradient>
          
          <!-- 은은하게 퍼지는 중앙 빛 -->
          <radialGradient id="sunGlow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="15%" stop-color="#fffde7" stop-opacity="0.9" />
            <stop offset="35%" stop-color="#fff59d" stop-opacity="0.6" />
            <stop offset="60%" stop-color="#ffb300" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#ff8f00" stop-opacity="0" />
          </radialGradient>
          
          <radialGradient id="leafGlow" cx="45%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="20%" stop-color="#fff59d" />
            <stop offset="55%" stop-color="#fbc02d" />
            <stop offset="85%" stop-color="#f57f17" />
            <stop offset="100%" stop-color="#b26a00" />
          </radialGradient>
          
          <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#4e2606" />
            <stop offset="30%" stop-color="#8d4b10" />
            <stop offset="65%" stop-color="#f5a623" />
            <stop offset="100%" stop-color="#fff59d" />
          </linearGradient>
          
          <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a0c926" />
            <stop offset="40%" stop-color="#558b2f" />
            <stop offset="100%" stop-color="#2e5812" />
          </linearGradient>
          
          <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e0f7fa" />
            <stop offset="50%" stop-color="#4dd0e1" />
            <stop offset="100%" stop-color="#00838f" />
          </linearGradient>
          
          <filter id="divineGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 배경 하늘 -->
        <rect width="1000" height="1300" fill="url(#skyGrad)" />
        
        <!-- 직선 광선을 제거하고 부드러운 원형 후광 레이어로 대체 -->
        <circle cx="500" cy="450" r="550" fill="url(#sunGlow)" />
        <circle cx="500" cy="450" r="300" fill="#ffffff" opacity="0.4" filter="url(#divineGlow)" />
        
        <!-- 구름 레이어 -->
        <g fill="#ffffff" opacity="0.65">
          <ellipse cx="120" cy="280" rx="160" ry="80" />
          <ellipse cx="250" cy="320" rx="120" ry="60" />
          <ellipse cx="880" cy="300" rx="170" ry="85" />
          <ellipse cx="760" cy="340" rx="130" ry="65" />
        </g>
        
        <!-- 풍성한 황금빛 나뭇잎 -->
        <g filter="url(#divineGlow)">
          <circle cx="500" cy="340" r="230" fill="url(#leafGlow)" opacity="0.95" />
          <circle cx="340" cy="390" r="180" fill="url(#leafGlow)" opacity="0.92" />
          <circle cx="660" cy="390" r="180" fill="url(#leafGlow)" opacity="0.92" />
          <circle cx="210" cy="480" r="145" fill="url(#leafGlow)" opacity="0.88" />
          <circle cx="790" cy="480" r="145" fill="url(#leafGlow)" opacity="0.88" />
          <circle cx="380" cy="510" r="155" fill="url(#leafGlow)" opacity="0.9" />
          <circle cx="620" cy="510" r="155" fill="url(#leafGlow)" opacity="0.9" />
          <circle cx="500" cy="450" r="210" fill="#fff9c4" opacity="0.65" />
        </g>
        
        <!-- 나무 기둥 및 가지 -->
        <g stroke="url(#trunkGrad)" stroke-linecap="round" fill="none">
          <path d="M460,980 Q485,740 455,610 Q420,490 320,380" stroke-width="48" />
          <path d="M540,980 Q515,740 545,610 Q580,490 680,380" stroke-width="48" />
          <path d="M500,980 Q500,660 500,440" stroke-width="56" />
          <path d="M470,640 Q360,540 220,490" stroke-width="26" />
          <path d="M530,640 Q640,540 780,490" stroke-width="26" />
          <path d="M480,520 Q390,430 320,320" stroke-width="20" />
          <path d="M520,520 Q610,430 680,320" stroke-width="20" />
          <path d="M440,980 Q360,1050 240,1110" stroke-width="24" stroke="#c47a16" />
          <path d="M560,980 Q640,1050 760,1110" stroke-width="24" stroke="#c47a16" />
        </g>
        
        <!-- 푸른 언덕 -->
        <ellipse cx="500" cy="1150" rx="550" ry="190" fill="url(#hillGrad)" />
        
        <!-- 생명수 폭포 -->
        <path d="M440,1070 Q470,1140 370,1300 L630,1300 Q530,1140 560,1070 Z" fill="url(#waterGrad)" opacity="0.9" />
        
        <!-- 반짝이는 빛 가루 강화 -->
        <g fill="#ffffff" filter="url(#divineGlow)" opacity="0.85">
          <circle cx="480" cy="420" r="6" />
          <circle cx="350" cy="320" r="5" />
          <circle cx="650" cy="330" r="7" />
          <circle cx="220" cy="440" r="4" />
          <circle cx="780" cy="450" r="5" />
          <circle cx="510" cy="270" r="6" />
          <circle cx="410" cy="230" r="4" />
          <circle cx="590" cy="260" r="5" />
          <circle cx="300" cy="530" r="6" />
          <circle cx="700" cy="540" r="4" />
        </g>
      </svg>
    </div>

    <!-- 열매들이 달리는 실시간 레이어 -->
    <div class="fruit-layer" id="fruitLayer"></div>
  </main>

  <!-- 열매 생성 / 수정 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle">열매 달기 🍎</h3>
      <p class="modal-coord-text">구역: <span id="currentZoneLabel">1구역</span></p>
      
      <div class="input-field">
        <label for="fruitName">이름</label>
        <input type="text" id="fruitName" placeholder="예: 홍길동" maxlength="12" autocomplete="off">
      </div>
      
      <div class="input-field">
        <label for="fruitRole">나의 합심</label>
        <input type="text" id="fruitRole" placeholder="예시: 활동, 후원, 응원 등" maxlength="30" autocomplete="off">
      </div>

      <div class="modal-actions" id="modalActions">
        <button type="button" class="btn btn-cancel" id="btnCancel">취소</button>
        <button type="button" class="btn btn-delete" id="btnDelete" style="display: none;">삭제</button>
        <button type="button" class="btn btn-save" id="btnSave">열매 맺기</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
